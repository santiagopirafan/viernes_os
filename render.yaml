services:
  - type: web
    name: viernes-os
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22.12.0
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TRANSCRIBE_MODEL
        value: whisper-large-v3
      - key: DASHBOARD_PORT
        value: 3911
      - key: GOOGLE_SHEETS_TITLE
        value: Viernes Finanzas
      # Secretos (configurar en el dashboard de Render, nunca en este archivo):
      # GROQ_API_KEY
      # WHATSAPP_VERIFY_TOKEN
      # WHATSAPP_APP_SECRET
      # WHATSAPP_ACCESS_TOKEN
      # WHATSAPP_PHONE_NUMBER_ID
      # WHATSAPP_ALLOWED_IDS
      # GOOGLE_SERVICE_ACCOUNT_JSON (pega el contenido del JSON)
      # GOOGLE_SHEETS_ID
# Nota: el disco de Render free es efímero (SQLite se reinicia con cada deploy).
# Para persistencia real agrega un Disk persistente (plan pago) montado en /opt/render/project/src/memory
# y otro en .../data, o migra la BD fuera.
